name: ci
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: bin/check-shots compares the commit that last
        # touched an image against the one that last touched the code it
        # is a picture of, and a shallow clone has neither.
        with:
          fetch-depth: 0

      # `qmlformat` is the only QML check a machine without the Omarchy shell
      # can perform: it parses without resolving imports, so it never sees
      # `qs.Commons` and never needs to. The full `qmllint` and the real
      # `omarchy plugin validate` run on an Omarchy box, and bin/verify says
      # plainly which of the three it skipped rather than implying all passed.
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq qt6-declarative-dev-tools

      - name: qmlformat is actually present
        run: test -x /usr/lib/qt6/bin/qmlformat || command -v qmlformat

      - name: screenshots are of the current code
        run: ./bin/check-shots

      - name: verify
        run: ./bin/verify

      # This one stubs everything Omarchy, so unlike bin/keys-e2e it does run
      # here — and it is worth the step, because the guard it covers fails in
      # the deploying direction when it fails at all.
      - name: the deploy guard falls the right way
        run: ./bin/check-deploy

      # bin/keys-e2e is deliberately absent from CI: it needs a compositor, a
      # running Omarchy shell and synthesised key events. Shellcheck it here so
      # the test that cannot run in CI is at least not rotting in it.
      - name: shellcheck the scripts
        run: sudo apt-get install -y --no-install-recommends shellcheck && shellcheck -S warning bin/verify bin/keys-e2e bin/shoot bin/check-shots bin/check-listing bin/deploy bin/check-deploy
